name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  structure:
    name: Plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin manifest, hooks, agent and skill frontmatter
        run: python3 scripts/validate.py

  shellcheck:
    name: Hook scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint hook scripts
        run: shellcheck hooks/*.sh

  hook-behavior:
    name: Hook behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke-test hooks against a simulated PostToolUse payload
        run: bash scripts/hook_smoke.sh hooks
